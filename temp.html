<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheque Clearance Form - Cocoon Group Tuition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <header>
            <img src="./cocoon logo.webp" alt="Cocoon Logo" class="logo">
            <h1 class="brand-name">COCOON GROUP TUITION</h1>
            <h2 class="form-title">CHEQUE CLEARANCE FORM</h2>
            <p class="form-subtitle">Update the clearance status of received cheques.</p>
        </header>

        <form id="clearanceForm">
            <!-- Section 1: Transaction Identification -->
            <section>
                <h3 class="section-title">Select Transaction</h3>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="txn_id">Transaction ID <span class="required">*</span></label>
                        <div class="searchable-dropdown" id="txnDropdown">
                            <input type="text" id="txn_id_search" placeholder="Search Txn ID..." autocomplete="off" required>
                            <div class="dropdown-list" id="txnList">
                                <div class="dropdown-item loading">Loading transactions...</div>
                            </div>
                            <input type="hidden" id="txn_id" name="txn_id">
                        </div>
                    </div>
                </div>

                <div id="mappedData" style="display: none; margin-top: 20px;">
                    <div class="grid-row">
                        <div class="input-group">
                            <label>Student Name</label>
                            <input type="text" id="student_name" readonly class="readonly-input">
                        </div>
                        <div class="input-group">
                            <label>Installment No.</label>
                            <input type="text" id="installment_no" readonly class="readonly-input">
                        </div>
                    </div>

                    <button type="button" class="details-toggle-btn" id="toggleDetails">
                        <span class="arrow">▼</span> View More Details
                    </button>

                    <div class="more-details" id="moreDetails">
                        <div class="detail-row">
                            <span class="detail-label">Amount:</span>
                            <span class="detail-value" id="disp_amount">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Cheque No:</span>
                            <span class="detail-value" id="disp_cheque_no">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Bank:</span>
                            <span class="detail-value" id="disp_bank">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Due Date:</span>
                            <span class="detail-value" id="disp_due_date">-</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section 2: Clearance Action -->
            <section id="actionSection" style="display: none;">
                <h3 class="section-title">Update Status</h3>
                <div class="grid-row">
                    <div class="input-group">
                        <label for="status">Cheque Status <span class="required">*</span></label>
                        <select id="status" name="status" required>
                            <option value="Cleared" selected>Cleared</option>
                            <option value="Bounced">Bounced</option>
                        </select>
                    </div>
                    <div class="input-group" id="clearedDateGroup" style="display: none;">
                        <label for="cleared_date">Clearance Date <span class="required">*</span></label>
                        <input type="date" id="cleared_date" name="cleared_date">
                    </div>
                </div>
                <div class="input-group">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" name="remarks" rows="3" placeholder="Additional notes..."></textarea>
                </div>
            </section>


            <div class="form-actions">
                <button type="submit" class="submit-btn" id="submitBtn">Submit Update</button>
            </div>
        </form>
    </div>
    <!-- Premium Modal System -->
    <div id="cocoonModal" class="modal-backdrop">
        <div class="modal-content">
            <div id="modalIcon" class="modal-icon">✓</div>
            <h2 id="modalTitle">TITLE</h2>
            <p id="modalMessage">Message goes here.</p>
            <div id="modalActions" class="modal-actions">
                <button id="modalSecondaryBtn" class="modal-btn secondary">Cancel</button>
                <button id="modalPrimaryBtn" class="modal-btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="receipt-render-target" style="opacity: 0; position: absolute; top: 0; left: 0; pointer-events: none;"></div>
    <script src="html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
